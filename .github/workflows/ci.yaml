name: ci
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/hasantahsinakin/myapp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}

      - name: Trivy taraması (sadece raporlar)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Manifest reposundaki tag'i güncelle
        env:
          TOKEN: ${{ secrets.MANIFEST_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/hasantahsinakin/myapp-manifests.git
          cd myapp-manifests/overlays/dev
          sed -i "s/newTag: .*/newTag: ${GITHUB_SHA}/" kustomization.yaml
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git commit -am "myapp: ${GITHUB_SHA}"
          git push
